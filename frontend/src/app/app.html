<!-- Contenedor de Notificaciones Toast Flotantes -->
<div class="toast-container" *ngIf="(toasts$ | async) as toasts">
  <div
    class="toast"
    *ngFor="let toast of toasts"
    [ngClass]="{
      'toast-success': toast.tipo === 'success',
      'toast-error': toast.tipo === 'error',
      'toast-info': toast.tipo === 'info',
      'toast-warning': toast.tipo === 'warning'
    }"
  >
    <div class="toast-icon">
      <i class="fa-solid fa-circle-check" *ngIf="toast.tipo === 'success'"></i>
      <i class="fa-solid fa-circle-xmark" *ngIf="toast.tipo === 'error'"></i>
      <i class="fa-solid fa-circle-info" *ngIf="toast.tipo === 'info'"></i>
      <i class="fa-solid fa-triangle-exclamation" *ngIf="toast.tipo === 'warning'"></i>
    </div>
    <div class="toast-body">
      <strong class="toast-title">{{ toast.titulo }}</strong>
      <p class="toast-message">{{ toast.mensaje }}</p>
    </div>
    <button type="button" class="toast-close" (click)="dismissToast(toast.id)" aria-label="Cerrar notificación">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
</div>
